name: inkflow
description: InkFlow - Plataforma para tatuadores e clientes
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.0.0
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  image_picker: ^1.2.2
  just_audio: ^0.10.6
  record: ^7.1.1
  video_player: ^2.14.0
  flutter_riverpod: ^3.3.2
  supabase_flutter: ^2.14.2
  flutter_dotenv: ^6.0.1
  mask_text_input_formatter: ^2.9.0
  http: ^1.2.2
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/inkflow_logo.png
    - .env
